name: Build and Push Docker Image

on:
  push:
    branches:
      - claude/keen-mccarthy-doc3ue
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/storageui:presigned-share
            ${{ secrets.DOCKERHUB_NAMESPACE }}/storageui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
